name: Build search index

# Run manually, or automatically whenever the product CSV changes.
on:
  workflow_dispatch:
  push:
    paths:
      - "data/products.csv"

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download catalogue images
        run: python -m src.download_images

      - name: Build FAISS index + embeddings
        run: python -m src.build_index

      - name: Commit built index
        run: |
          git config user.name "tailortalk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add indexes/
          git diff --cached --quiet || git commit -m "Auto-build: refresh search index"
          git push
